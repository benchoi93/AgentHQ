upstream backend {
    server backend:8000;
}

server {
    listen 8420;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # The SPA shell (index.html) is unhashed and names the hashed JS/CSS
        # chunks. It must revalidate on every load, else browsers heuristically
        # cache it (~10% of Last-Modified age) and keep loading the OLD chunk
        # after a redeploy — which silently reverts fixes like the terminal
        # scroll handler. Hashed /assets/ stay immutable; only the shell 304s.
        add_header Cache-Control "no-cache";
    }

    # Vite hashed assets — aggressive caching
    location /assets/ {
        root /usr/share/nginx/html;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check
    location /health {
        proxy_pass http://backend;
    }
}
